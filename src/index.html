<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PB VPN</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-glow g1"></div><div class="bg-glow g2"></div>

<header class="titlebar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="18" height="18"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path d="M16 2.5 4.5 7v8.2c0 6.6 4.6 12.2 11.5 14.3 6.9-2.100 11.500-7.700 11.500-14.300V7z" fill="url(#lg)"/><path d="M11 16.500l3.600 3.600L21.500 12" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>PB VPN</span>
  </div>
  <div class="win-btns">
    <button data-win="min" aria-label="Minimér"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
    <button data-win="max" aria-label="Maksimér"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
    <button data-win="close" class="close" aria-label="Luk"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="side-head"><span>Tunneler</span><button id="btnAdd" class="icon-btn" title="Tilføj tunnel (Ctrl+N)"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div id="tunnelList" class="tunnel-list"></div>
    <div class="side-foot">
      <button id="navSettings" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M12 15.500a3.500 3.500 0 100-7 3.500 3.500 0 000 7z" fill="none" stroke="currentColor" stroke-width="1.800"/><path d="M19.400 13.500a7.700 7.700 0 000-3l2-1.600-2-3.400-2.400 1a7.600 7.600 0 00-2.600-1.500L14 2.500h-4l-.4 2.500A7.600 7.600 0 007 6.500l-2.400-1-2 3.400 2 1.600a7.700 7.700 0 000 3l-2 1.600 2 3.400 2.400-1c.8.700 1.700 1.200 2.600 1.500l.4 2.500h4l.4-2.500c.9-.3 1.800-.8 2.600-1.500l2.400 1 2-3.400z" fill="none" stroke="currentColor" stroke-width="1.600" stroke-linejoin="round"/></svg>Indstillinger<span id="updDot" class="upd-dot" hidden></span></button>
      <div class="ver" id="verText"></div>
    </div>
  </aside>

  <main class="main">
    <div id="banners"></div>

    <!-- Tom tilstand -->
    <section id="viewEmpty" class="view empty" hidden>
      <div class="drop-card" id="dropCard">
        <div class="drop-icon"><svg viewBox="0 0 48 48"><path d="M24 6v26M14 22l10 10 10-10M8 40h32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h1>Tilføj din første tunnel</h1>
        <p>Træk en <b>.conf</b>-fil hertil, vælg en fil eller indsæt konfigurationen direkte.</p>
        <div class="row center">
          <button class="btn primary" id="emptyPick">Vælg fil</button>
          <button class="btn" id="emptyPaste">Indsæt tekst</button>
        </div>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="viewDash" class="view dash" hidden>
      <div class="hero card">
        <button id="power" class="power" aria-label="Forbind">
          <span class="ring"></span><span class="ring r2"></span>
          <svg viewBox="0 0 48 48"><path d="M24 6v17M14.500 12.500a16 16 0 1019 0" fill="none" stroke="currentColor" stroke-width="3.600" stroke-linecap="round"/></svg>
        </button>
        <div class="hero-info">
          <div class="status-line"><span id="statusDot" class="dot"></span><span id="statusText">Ikke forbundet</span></div>
          <h2 id="tName">–</h2>
          <div class="uptime" id="uptime">00:00:00</div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="hero-actions">
          <button class="icon-btn" id="btnEdit" title="Rediger konfiguration"><svg viewBox="0 0 20 20"><path d="M4 14.500V16h1.500l7.800-7.800-1.500-1.500zM14.200 5.800l-1.500-1.500 1-1a1 1 0 011.400 0l.1.100a1 1 0 010 1.400z" fill="currentColor"/></svg></button>
          <button class="icon-btn" id="btnExport" title="Eksportér .conf"><svg viewBox="0 0 20 20"><path d="M10 3v9M6.500 8.500L10 12l3.500-3.500M4 15.500h12" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="icon-btn danger" id="btnDelete" title="Slet tunnel"><svg viewBox="0 0 20 20"><path d="M5 6h10M8 6V4.500h4V6M6.500 6l.6 9.500h5.800l.6-9.500" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>

      <div class="metrics">
        <div class="card metric" id="mDown">
          <div class="m-head"><span class="m-label"><svg viewBox="0 0 20 20"><path d="M10 4v10M6 10.500l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Download</span><span class="m-sub" id="downTotal">0 B</span></div>
          <div class="m-value"><span class="num" id="downNum">0</span><span class="unit" id="downUnit">Mbit/s</span></div>
          <canvas id="cDown"></canvas>
        </div>
        <div class="card metric" id="mUp">
          <div class="m-head"><span class="m-label"><svg viewBox="0 0 20 20"><path d="M10 16V6M6 9.500l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Upload</span><span class="m-sub" id="upTotal">0 B</span></div>
          <div class="m-value"><span class="num" id="upNum">0</span><span class="unit" id="upUnit">Mbit/s</span></div>
          <canvas id="cUp"></canvas>
        </div>
        <div class="card metric" id="mLat">
          <div class="m-head"><span class="m-label"><svg viewBox="0 0 20 20"><path d="M2.500 10h3l2-5 3 10 2-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Latency</span><span class="m-sub" id="latSub">–</span></div>
          <div class="m-value"><span class="num" id="latNum">–</span><span class="unit">ms</span></div>
          <canvas id="cLat"></canvas>
        </div>
      </div>

      <div class="card details" id="details"></div>
    </section>

    <!-- Indstillinger -->
    <section id="viewSettings" class="view settings" hidden></section>
  </main>
</div>

<div id="dragOverlay" class="drag-overlay" hidden><div><svg viewBox="0 0 48 48" width="56" height="56"><path d="M24 6v26M14 22l10 10 10-10M8 40h32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>Slip for at importere</h2><p>.conf-filer føjes til dine tunneler</p></div></div>
<div id="modalRoot"></div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
